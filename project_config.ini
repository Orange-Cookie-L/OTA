# 项目配置文件

[Project]
Name=STM32F403_ESP8266_OTA
Version=1.0.0
Description=基于 STM32F403 和 ESP8266 的远程升级系统

[STM32]
MCU=STM32F403VCT6
Flash_Size=1024K
RAM_Size=128K
Bootloader_Start=0x08000000
Bootloader_Size=64K
Application_Start=0x08010000
Application_Size=960K
Valid_Flag_Addr=0x0800FFF0
OTA_Trigger_Addr=0x0800FFF8

[ESP8266]
Model=ESP8266
Flash_Size=4M
BaudRate=115200
RX_Pin=5
TX_Pin=4
LED_Pin=2

[Communication]
Protocol=UART
BaudRate=115200
PacketSize=512
Timeout=5000
MaxRetries=3

[Server]
Host=localhost
Port=5000
Protocol=http
Upload_Endpoint=/firmware
Download_Endpoint=/firmware/download
Info_Endpoint=/firmware/info
Latest_Endpoint=/firmware/latest
Device_Register_Endpoint=/device/register
Device_Heartbeat_Endpoint=/device/heartbeat
Device_Check_Update_Endpoint=/device/check-update
Device_List_Endpoint=/device/list
Push_Update_Endpoint=/push/update
Push_Status_Endpoint=/push/status
Push_Clear_Endpoint=/push/clear
Push_Acknowledge_Endpoint=/push/acknowledge

[Device]
Auto_Register=true
Heartbeat_Interval=30000
Check_Update_Interval=300000
Device_ID_Prefix=STM32_
Offline_Threshold=600

[Security]
Enable_CRC32=true
Enable_Signature=false
Enable_Encryption=false
Max_Firmware_Size=960K

[Logging]
Enable=true
Level=INFO
File=ota.log

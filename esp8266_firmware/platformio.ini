[env:esp8266_ota]
platform = espressif8266
board = nodemcuv2
framework = arduino

lib_deps =
    ESP8266WiFi
    ESP8266HTTPClient
    ArduinoJson@6.21.3

upload_speed = 115200
monitor_speed = 115200

build_flags =
    -DWIFI_SSID=\"YourWiFiSSID\"
    -DWIFI_PASSWORD=\"YourWiFiPassword\"
    -DSERVER_BASE_URL=\"http://your-server.com\"
    -DSERVER_PORT=5000
    -DPACKET_SIZE=512
